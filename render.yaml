# Render Blueprint — see BE/README.md for the full env var contract these
# services rely on, and README.md at the repo root for the FE/BE split.
#
# The database stays on Neon (already set up and verified — see BE/README.md
# "Database setup"), not Render's own managed Postgres. DB_URL/DB_USER/
# DB_PASSWORD below are `sync: false` — paste in the Neon pooled connection
# string's pieces from the Render dashboard after the blueprint is created.
# Use the pooled endpoint (hostname has "-pooler" in it) with
# ?sslmode=require&prepareThreshold=0 appended — see BE/README.md for why.
#
# Second first-deploy gotcha: each service's *.onrender.com URL only exists
# once it has been created, so ALLOWED_ORIGIN_PATTERNS (on messenger-be) and
# VITE_API_BASE_URL (on messenger-fe) can't be filled in until after the
# first deploy. Also left as `sync: false` — set from the dashboard once both
# URLs are known, then redeploy both services.
services:
  - type: web
    name: messenger-be
    runtime: docker
    rootDir: BE
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ALLOWED_ORIGIN_PATTERNS
        sync: false

  - type: web
    name: messenger-fe
    runtime: static
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
