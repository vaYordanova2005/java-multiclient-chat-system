name: BE build & tests

# Причината този workflow да съществува: интеграционните тестове в BE/
# (*IT.java) вдигат реален Postgres през Testcontainers, което изисква
# работещ Docker daemon. Машината, на която се разработва проектът, няма
# Docker — затова `./mvnw verify` там винаги се проваля на
# "Could not find a valid Docker environment" и *IT тестовете на практика
# никога не се изпълняват. GitHub-ските ubuntu runner-и идват с Docker
# инсталиран, така че тук те се въртят наистина, на всеки push.
#
# `./mvnw test` (само unit тестовете) продължава да работи и локално без
# Docker — виж секцията "Testing" в BE/README.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # ръчно пускане от Actions таба

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven      # кешира ~/.m2, за да не тегли зависимостите наново всеки път

      # `verify` минава през целия lifecycle: compile -> Surefire (*Test.java)
      # -> package -> Failsafe (*IT.java, с Testcontainers). Не подаваме
      # DB_PASSWORD — интеграционните тестове си вдигат собствен Postgres
      # контейнер и пренасочват datasource-а към него през
      # @DynamicPropertySource / собствен HikariConfig.
      - name: Build and run all tests
        run: ./mvnw --batch-mode verify

      # Surefire/Failsafe отчетите се качват дори при провал — иначе от лога
      # на неуспешен IT се вижда само stack trace-ът, без пълния изход.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            BE/target/surefire-reports/
            BE/target/failsafe-reports/
          if-no-files-found: ignore
