name: BE build & tests

# Why this workflow exists: the integration tests in BE/ (*IT.java) start a
# real Postgres through Testcontainers, which needs a running Docker daemon.
# The machine this project is developed on has no Docker — so `./mvnw verify`
# there always fails with "Could not find a valid Docker environment" and the
# *IT tests effectively never run. GitHub's ubuntu runners ship with Docker
# installed, so here they do run for real, on every push.
#
# `./mvnw test` (unit tests only) keeps working locally without Docker — see
# the "Testing" section in BE/README.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven      # caches ~/.m2 so dependencies aren't re-downloaded every run

      # `verify` runs the whole lifecycle: compile -> Surefire (*Test.java)
      # -> package -> Failsafe (*IT.java, with Testcontainers). We don't pass
      # DB_PASSWORD — the integration tests start their own Postgres container
      # and point the datasource at it via @DynamicPropertySource / their own
      # HikariConfig.
      - name: Build and run all tests
        run: ./mvnw --batch-mode verify

      # Surefire/Failsafe reports are uploaded even on failure — otherwise a
      # failed IT only leaves a stack trace in the log, without the full output.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            BE/target/surefire-reports/
            BE/target/failsafe-reports/
          if-no-files-found: ignore
